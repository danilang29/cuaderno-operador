<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style></head><body>
<title>Cuaderno del Operador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#f3f5f2;
  --surface:#ffffff;
  --surface-2:#e9ede9;
  --line:#d5dbd6;
  --line-strong:#b9c2bb;
  --ink:#16211b;
  --ink-2:#5c6a63;
  --ink-3:#8b978f;
  --accent:#178a47;
  --accent-ink:#ffffff;
  --accent-soft:#dff2e6;
  --danger:#c43d3d;
  --shadow:0 1px 2px rgba(22,33,27,.06),0 8px 24px rgba(22,33,27,.08);
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#4a3aa7;--s8:#e34948;
  --display:"Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0f1411;--surface:#171e19;--surface-2:#1f2823;--line:#2a352e;--line-strong:#3a4740;
    --ink:#e8efea;--ink-2:#a3b0a8;--ink-3:#6f7c75;
    --accent:#3fcb7c;--accent-ink:#0b1a10;--accent-soft:#1a3324;--danger:#f07070;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f1411;--surface:#171e19;--surface-2:#1f2823;--line:#2a352e;--line-strong:#3a4740;
  --ink:#e8efea;--ink-2:#a3b0a8;--ink-3:#6f7c75;
  --accent:#3fcb7c;--accent-ink:#0b1a10;--accent-soft:#1a3324;--danger:#f07070;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{margin:0;font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.01em;text-transform:uppercase;line-height:1}
.brand .sub{color:var(--ink-3);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.season{display:flex;align-items:center;gap:6px;margin-left:auto}
.season label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.season select{background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:6px 10px;font-family:var(--display);font-size:18px;font-weight:600}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:4px;padding:7px 12px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-family:var(--display);font-size:17px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;padding:6px 14px}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:4px 8px;font-size:12px}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.badge{background:var(--accent);color:var(--accent-ink);border-radius:999px;font-size:11px;font-weight:600;padding:0 6px;line-height:16px}
.next{color:var(--accent);font-weight:500;text-transform:uppercase;font-size:11px;letter-spacing:.06em}
.status{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--ink-3);display:inline-block}
.status.ok i{background:var(--accent)}

/* ---------- page ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:20px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px 10px}
.tile .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.tile .v{font-family:var(--display);font-size:40px;font-weight:700;line-height:1;margin-top:4px}
.tile .v small{font-size:18px;color:var(--ink-3);font-weight:600;margin-left:6px}
.tile .d{font-size:12px;color:var(--ink-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.apply{background:var(--accent-soft);border:1px solid var(--accent);border-radius:6px;padding:12px 14px;margin-bottom:18px}
.apply h3{margin:0 0 6px;font-family:var(--display);font-size:20px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.apply p{margin:0 0 10px;font-size:13px;color:var(--ink-2)}
.apply ul{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:3px;font-size:13px}
.apply ul b{font-family:var(--display);font-size:15px}
.apply .acts2{display:flex;gap:8px;flex-wrap:wrap}

.filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:4px 10px 4px 8px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip i{width:9px;height:9px;border-radius:2px;background:var(--c,var(--ink-3));display:inline-block}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{color:var(--ink-3);font-size:11px}
.chip.on .n{color:inherit;opacity:.7}
.ctl{background:var(--surface);border:1px solid var(--line-strong);border-radius:4px;padding:6px 10px;min-width:150px}
.ctl::placeholder{color:var(--ink-3)}
.link{background:none;border:0;color:var(--ink-2);text-decoration:underline;padding:4px;font-size:13px}

.grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
aside{position:sticky;top:76px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.card h3{margin:0 0 8px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);font-weight:600}

/* ---------- month chart ---------- */
.chart{position:relative;height:120px}
.chart svg{width:100%;height:100%;display:block;overflow:visible}
.chart .bar{fill:var(--accent);rx:3}
.chart .bar.dim{fill:var(--surface-2);stroke:var(--line);stroke-width:1}
.chart .hit{fill:transparent;cursor:default}
.chart .hit:hover + .bar{filter:brightness(1.15)}
.chart text{font-family:var(--body);font-size:10px;fill:var(--ink-3)}
.chart text.val{fill:var(--ink-2);font-family:var(--display);font-size:12px;font-weight:600}
.chart .base{stroke:var(--line-strong);stroke-width:1}
.chart .tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:4px 8px;border-radius:4px;white-space:nowrap;transform:translate(-50%,-110%);display:none}
.teams{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.teams li{display:flex;align-items:center;gap:8px}
.teams button{background:none;border:0;padding:2px 0;text-align:left;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.teams button:hover{color:var(--accent);text-decoration:underline}
.teams .bar{height:6px;background:var(--accent);border-radius:2px;opacity:.85}
.teams .cnt{font-family:var(--display);font-weight:600;font-size:15px;width:22px;text-align:right;color:var(--ink-2)}

/* ---------- match list ---------- */
.month{margin-bottom:22px}
.month h2{margin:0 0 6px;font-family:var(--display);font-size:18px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-2);display:flex;align-items:baseline;gap:8px}
.month h2 span{font-size:13px;color:var(--ink-3);font-family:var(--body);text-transform:none;letter-spacing:0;font-weight:400}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.row{display:grid;grid-template-columns:58px 1fr auto;gap:0 14px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);position:relative}
.row:first-child{border-top:0}
.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--line-strong))}
.date{text-align:center;line-height:1.05}
.date b{display:block;font-family:var(--display);font-size:26px;font-weight:700}
.date span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.match{min-width:0}
.score{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:22px;font-weight:600;line-height:1.1;flex-wrap:wrap}
.score .t{background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left}
.score .t:hover{color:var(--accent)}
.score .r{background:var(--ink);color:var(--bg);padding:1px 8px;border-radius:3px;font-size:18px;letter-spacing:.1em;min-width:52px;text-align:center}
.score .r.na{background:var(--surface-2);color:var(--ink-3);letter-spacing:.2em}
.meta{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:3px}
.meta .comp{display:inline-flex;align-items:center;gap:5px;font-weight:500;color:var(--ink)}
.meta .comp i{width:9px;height:9px;border-radius:2px;background:var(--c,var(--ink-3))}
.meta .note{color:var(--ink-3);font-style:italic}
.acts{display:flex;gap:4px;opacity:0;transition:opacity .15s}
.row:hover .acts,.row:focus-within .acts{opacity:1}
@media (prefers-reduced-motion:reduce){.acts{transition:none}}
.empty{padding:40px 20px;text-align:center;color:var(--ink-3);background:var(--surface);border:1px dashed var(--line-strong);border-radius:6px}
.empty b{display:block;font-family:var(--display);font-size:22px;color:var(--ink-2);font-weight:600;margin-bottom:4px}

/* ---------- dialog ---------- */
dialog{border:0;border-radius:8px;padding:0;background:var(--surface);color:var(--ink);box-shadow:var(--shadow);width:min(560px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(10,20,14,.5)}
.dlg-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.dlg-h h2{margin:0;font-family:var(--display);font-size:22px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.dlg-b{padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.f{display:flex;flex-direction:column;gap:4px}
.f.full{grid-column:1/-1}
.f label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.f input,.f select,.f textarea{background:var(--bg);border:1px solid var(--line-strong);border-radius:4px;padding:7px 9px}
.f textarea{resize:vertical;min-height:54px}
.vs{grid-column:1/-1;display:grid;grid-template-columns:1fr 64px 24px 64px 1fr;gap:8px;align-items:end}
.vs .dash{text-align:center;padding-bottom:9px;color:var(--ink-3);font-family:var(--display);font-size:18px}
.vs input[type=number]{text-align:center;font-family:var(--display);font-size:20px;font-weight:600;padding:4px}
.dlg-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.err{grid-column:1/-1;color:var(--danger);font-size:13px;display:none}
.err.show{display:block}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:4px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
.toast.show{opacity:1}

@media (max-width:860px){
  .tiles{grid-template-columns:repeat(2,1fr)}
  .grid{grid-template-columns:1fr}
  aside{position:static}
  .top-in{gap:10px}
  .season{margin-left:0}
}
@media (max-width:520px){
  .row{grid-template-columns:48px 1fr;gap:0 10px}
  .acts{grid-column:1/-1;opacity:1;justify-content:flex-end;margin-top:6px}
  .score{font-size:18px}
  .dlg-b{grid-template-columns:1fr}
  .vs{grid-template-columns:1fr 54px 20px 54px 1fr}
}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1>Cuaderno del Operador</h1>
      <span class="sub">Partidos realizados</span>
    </div>
    <div class="season">
      <label for="season">Temporada</label>
      <select id="season"></select>
    </div>
    <span class="status" id="status"><i></i><span>Conectando…</span></span>
    <button class="btn" id="refreshBtn" hidden title="Copiar la lista de partidos jugados sin resultado para pedírselos a Claude">↻ Resultados <span class="badge" id="refreshN"></span></button>
    <button class="btn" id="exportBtn" hidden title="Descargar CSV de la temporada">CSV</button>
    <button class="btn primary" id="addBtn">+ Añadir partido</button>
  </div>
</header>

<main class="wrap">
  <section class="tiles" id="tiles"></section>

  <section class="apply" id="apply" hidden></section>

  <section class="filters">
    <div class="chips" id="compChips"></div>
    <select class="ctl" id="monthSel"><option value="">Todos los meses</option></select>
    <input class="ctl" id="teamQ" type="search" placeholder="Buscar equipo…" autocomplete="off">
    <button class="link" id="clearBtn" hidden>Limpiar filtros</button>
  </section>

  <div class="grid">
    <section id="list"></section>
    <aside>
      <div class="card">
        <h3>Partidos por mes</h3>
        <div class="chart" id="chart"></div>
      </div>
      <div class="card">
        <h3>Equipos más repetidos</h3>
        <ul class="teams" id="teams"></ul>
      </div>
    </aside>
  </div>
</main>

<dialog id="dlg">
  <form method="dialog" id="form" novalidate>
    <div class="dlg-h"><h2 id="dlgTitle">Nuevo partido</h2><button type="button" class="btn small" id="closeBtn">Cerrar</button></div>
    <div class="dlg-b">
      <div class="f"><label for="fFecha">Fecha</label><input type="date" id="fFecha" required></div>
      <div class="f"><label for="fHora">Hora</label><input type="time" id="fHora"></div>
      <div class="f"><label for="fComp">Competición</label><input id="fComp" list="compList" required placeholder="LaLiga EA Sports"></div>
      <div class="f"><label for="fJornada">Jornada / ronda</label><input id="fJornada" placeholder="J3, Octavos…"></div>
      <div class="vs">
        <div class="f"><label for="fLocal">Local</label><input id="fLocal" list="teamList" required></div>
        <div class="f"><label for="fGL">Goles</label><input type="number" id="fGL" min="0" placeholder="–"></div>
        <div class="dash">–</div>
        <div class="f"><label for="fGV">Goles</label><input type="number" id="fGV" min="0" placeholder="–"></div>
        <div class="f"><label for="fVisit">Visitante</label><input id="fVisit" list="teamList" placeholder="vacío si es un evento"></div>
      </div>
      <div class="f"><label for="fSede">Estadio / sede</label><input id="fSede" list="sedeList"></div>
      <div class="f"><label for="fPuesto">Puesto / función</label><input id="fPuesto" list="puestoList" placeholder="EVS, cámara, sonido…"></div>
      <div class="f full"><label for="fNotas">Notas</label><textarea id="fNotas" placeholder="Incidencias, compañeros, algo que recordar…"></textarea></div>
      <div class="err" id="err"></div>
    </div>
    <div class="dlg-f">
      <button type="button" class="btn danger" id="delBtn" hidden>Eliminar</button>
      <button type="submit" class="btn primary" id="saveBtn">Guardar</button>
    </div>
  </form>
</dialog>
<datalist id="compList"></datalist>
<datalist id="teamList"></datalist>
<datalist id="sedeList"></datalist>
<datalist id="puestoList"></datalist>
<div class="toast" id="toast"></div>

let matches=[];               // {id, fecha, hora, competicion, jornada, local, visitante, gl, gv, sede, puesto, notas, temporada}
let db=null, downloads=null;
const LS='cuaderno-operador-partidos';
const localStore={
  load(){
    try {
      let stored = localStorage.getItem(LS);
      if (stored && stored !== '[]') {
        matches = JSON.parse(stored);
      } else {
        matches = JSON.parse(JSON.stringify(defaultMatches)); // Deep copy
        this.save();
      }
    } catch(e) {
      matches = JSON.parse(JSON.stringify(defaultMatches));
    }
    render();
  },
  save(){try{localStorage.setItem(LS,JSON.stringify(matches));}catch(e){}render();},
  async put(m){const i=matches.findIndex(x=>x.id===m.id);if(i>=0)matches[i]=m;else matches.push(m);this.save();},
  async del(id){matches=matches.filter(x=>x.id!==id);this.save();}
};
let store=localStore;
const setStatus=(txt,ok)=>{const s=$('#status');s.className='status'+(ok?' ok':'');s.querySelector('span').textContent=txt;};

/* ---------- estado de filtros ---------- */
const state={season:'2025/2026',comps:new Set(),month:'',team:''};
const compSlots=new Map();
function slotFor(comp){
  if(COMP_SLOT[comp])return COMP_SLOT[comp];
  if(compSlots.has(comp))return compSlots.get(comp);
  const used=new Set([...Object.values(COMP_SLOT),...compSlots.values()]);
  let s=1;while(used.has(s)&&s<8)s++;
  compSlots.set(comp,s);return s;
}
const colorOf=comp=>`var(--s${slotFor(comp)})`;

/* ---------- render ---------- */
function render(){
  matches.forEach(m=>{if(!m.temporada&&m.fecha)m.temporada=seasonOf(m.fecha);});
  // temporadas
  const seasons=new Set(matches.map(m=>m.temporada).filter(Boolean));seasons.add('2025/2026');
  const sel=$('#season');const cur=state.season;
  sel.innerHTML=[...seasons].sort().reverse().map(s=>`<option ${s===cur?'selected':''}>${s}</option>`).join('');
  state.season=sel.value;

  const inSeason=matches.filter(m=>m.temporada===state.season).sort((a,b)=>(b.fecha+(b.hora||'')).localeCompare(a.fecha+(a.hora||'')));
  const compCount={};inSeason.forEach(m=>compCount[m.competicion]=(compCount[m.competicion]||0)+1);
  // limpiar filtros que ya no existen
  [...state.comps].forEach(c=>{if(!compCount[c])state.comps.delete(c);});

  const q=norm(state.team);
  const shown=inSeason.filter(m=>
    (!state.comps.size||state.comps.has(m.competicion))&&
    (!state.month||new Date(m.fecha+'T00:00:00').getMonth()===+state.month)&&
    (!q||norm(m.local).includes(q)||norm(m.visitante).includes(q))
  );
  const filtered=state.comps.size||state.month||q;
  $('#clearBtn').hidden=!filtered;

  renderTiles(shown,inSeason,filtered);
  renderApply();
  renderChips(compCount);
  renderMonthSel(inSeason);
  renderList(shown,inSeason.length);
  renderChart(shown);
  renderTeams(shown);
  renderDatalists();
  const pend=pendingResults();$('#refreshBtn').hidden=!pend.length;$('#refreshN').textContent=pend.length;
}
const today=()=>new Date().toISOString().slice(0,10);
function pendingResults(){return matches.filter(m=>m.visitante&&(m.gl==null||m.gv==null)&&m.fecha<=today()).sort((a,b)=>a.fecha.localeCompare(b.fecha));}

const hits=(txt,keys)=>{const n=norm(txt);return keys.some(k=>n.includes(k));};
function applyPairs(){
  const out=[];
  RESULTS.forEach(r=>{
    const m=matches.find(x=>x.fecha===r.fecha&&x.visitante&&hits(x.local,r.kl)&&hits(x.visitante,r.kv)&&(x.gl==null||x.gv==null));
    if(m)out.push({m,r});
  });
  return out;
}
function renderApply(){
  const pairs=applyPairs();const el=$('#apply');
  el.hidden=!pairs.length;
  if(!pairs.length)return;
  el.innerHTML=`<h3>Resultados encontrados</h3>
    <p>He buscado el marcador, la hora y el estadio de ${pairs.length} ${pairs.length===1?'partido':'partidos'}. Revísalos y pulsa para guardarlos en el cuaderno.</p>
    <ul>${pairs.map(({m,r})=>`<li>${esc(m.fecha)} · ${esc(m.local)} <b class="num">${r.gl}–${r.gv}</b> ${esc(m.visitante)} · ${r.hora} h · ${esc(r.sede)}</li>`).join('')}</ul>
    <div class="acts2"><button class="btn primary" id="applyBtn">Guardar ${pairs.length} ${pairs.length===1?'resultado':'resultados'}</button></div>`;
}
document.addEventListener('click',async e=>{
  if(!e.target.closest('#applyBtn'))return;
  const btn=e.target.closest('#applyBtn');btn.disabled=true;
  const pairs=applyPairs();let ok=0;
  for(const {m,r} of pairs){
    try{await store.put({...m,gl:r.gl,gv:r.gv,hora:m.hora||r.hora,sede:m.sede||r.sede,jornada:m.jornada||r.jornada});ok++;}
    catch(ex){}
  }
  toast(ok===pairs.length?`${ok} ${ok===1?'resultado guardado':'resultados guardados'}`:`Guardados ${ok} de ${pairs.length}`);
  btn.disabled=false;render();
});

function renderTiles(shown,all,filtered){
  const teams=new Set();shown.forEach(m=>{teams.add(m.local);if(m.visitante)teams.add(m.visitante);});
  const comps=new Set(shown.map(m=>m.competicion));
  const byMonth={};shown.forEach(m=>{const k=new Date(m.fecha+'T00:00:00').getMonth();byMonth[k]=(byMonth[k]||0)+1;});
  const top=Object.entries(byMonth).sort((a,b)=>b[1]-a[1])[0];
  const homeCount={};shown.forEach(m=>homeCount[m.sede||m.local]=(homeCount[m.sede||m.local]||0)+1);
  const topSede=Object.entries(homeCount).sort((a,b)=>b[1]-a[1])[0];
  $('#tiles').innerHTML=`

    <div class="tile"><div class="k">Mes más cargado</div><div class="v">${top?cap(MESES[+top[0]]):'—'}</div><div class="d">${top?top[1]+' partido'+(top[1]===1?'':'s'):'sin datos'}</div></div>
    <div class="tile"><div class="k">Sede más visitada</div><div class="v" style="font-size:24px;margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${esc(topSede?topSede[0]:'')}">${topSede?esc(topSede[0]):'—'}</div><div class="d">${topSede?topSede[1]+' vez'+(topSede[1]===1?'':'es'):'sin datos'}</div></div>`;
}
function renderChips(compCount){

}
function renderMonthSel(inSeason){
  const present=new Set(inSeason.map(m=>new Date(m.fecha+'T00:00:00').getMonth()));
  const sel=$('#monthSel');
  sel.innerHTML='<option value="">Todos los meses</option>'+SEASON_ORDER.filter(i=>present.has(i)).map(i=>`<option value="${i}" ${String(i)===state.month?'selected':''}>${cap(MESES[i])}</option>`).join('');
  if(state.month&&!present.has(+state.month))state.month='';
}
function renderList(shown,total){
  const el=$('#list');
  if(!shown.length){
    el.innerHTML=`<div class="empty"><b>${total?'Ningún partido con estos filtros':'Todavía no hay partidos en '+state.season}</b>${total?'Prueba a quitar algún filtro.':'Pulsa «Añadir partido» para registrar el primero.'}</div>`;return;
  }
  const groups=new Map();
  shown.forEach(m=>{const d=new Date(m.fecha+'T00:00:00');const k=d.getFullYear()+'-'+String(d.getMonth()).padStart(2,'0');if(!groups.has(k))groups.set(k,{d,items:[]});groups.get(k).items.push(m);});
  el.innerHTML=[...groups.values()].map(g=>`
    <div class="month"><h2>${MESES[g.d.getMonth()]} ${g.d.getFullYear()} <span class="num">${g.items.length} ${g.items.length===1?'partido':'partidos'}</span></h2>
    <div class="rows">${g.items.map(rowHTML).join('')}</div></div>`).join('');
}
function rowHTML(m){
  const d=new Date(m.fecha+'T00:00:00');
  const hasScore=m.gl!=null&&m.gv!=null&&m.gl!==''&&m.gv!=='';
  const meta=[`<span class="comp" style="--c:${colorOf(m.competicion)}"><i></i>${esc(m.competicion)}${m.jornada?' · '+esc(m.jornada):''}</span>`];
  if(m.fecha>today())meta.push('<span class="next">Próximo</span>');
  if(m.hora)meta.push(`<span class="num">${esc(m.hora)} h</span>`);
  if(m.sede)meta.push(`<span>${esc(m.sede)}</span>`);
  if(m.puesto)meta.push(`<span>${esc(m.puesto)}</span>`);
  if(m.notas)meta.push(`<span class="note">${esc(m.notas)}</span>`);
  return `<div class="row" style="--c:${colorOf(m.competicion)}" data-id="${m.id}">
    <div class="date"><b class="num">${d.getDate()}</b><span>${DIAS[d.getDay()]}</span></div>
    <div class="match">
      <div class="score"><button class="t" data-team="${esc(m.local)}">${esc(m.local)}</button>${m.visitante?`<span class="r num ${hasScore?'':'na'}">${hasScore?m.gl+'–'+m.gv:'vs'}</span><button class="t" data-team="${esc(m.visitante)}">${esc(m.visitante)}</button>`:''}</div>
      <div class="meta">${meta.join('')}</div>
    </div>
    <div class="acts"><button class="btn small" data-edit="${m.id}">Editar</button></div>
  </div>`;
}
function renderChart(shown){
  const counts=new Array(12).fill(0);
  shown.forEach(m=>counts[new Date(m.fecha+'T00:00:00').getMonth()]++);
  const W=272,H=110,pad=4,bw=18,gap=(W-12*bw)/11,max=Math.max(1,...counts),plotH=H-26;
  let bars='',labels='';
  SEASON_ORDER.forEach((mi,i)=>{
    const x=i*(bw+gap),h=counts[mi]?Math.max(4,counts[mi]/max*(plotH-pad)):0,y=plotH-h;
    bars+=`<rect class="hit" x="${x-gap/2}" y="0" width="${bw+gap}" height="${H}" data-m="${mi}" data-n="${counts[mi]}"></rect>`;
    bars+=counts[mi]?`<rect class="bar" x="${x}" y="${y}" width="${bw}" height="${h}"></rect>`:`<rect class="bar dim" x="${x}" y="${plotH-3}" width="${bw}" height="3"></rect>`;
    if(counts[mi])labels+=`<text class="val num" x="${x+bw/2}" y="${y-4}" text-anchor="middle">${counts[mi]}</text>`;
    labels+=`<text x="${x+bw/2}" y="${H-4}" text-anchor="middle">${MES3[mi]}</text>`;
  });
  $('#chart').innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="Partidos por mes"><line class="base" x1="0" x2="${W}" y1="${plotH}" y2="${plotH}"></line>${bars}${labels}</svg><div class="tip"></div>`;
}
function renderTeams(shown){
  const c={};shown.forEach(m=>{c[m.local]=(c[m.local]||0)+1;if(m.visitante)c[m.visitante]=(c[m.visitante]||0)+1;});
  const top=Object.entries(c).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).slice(0,8);
  const max=top[0]?top[0][1]:1;
  $('#teams').innerHTML=top.length?top.map(([t,n])=>`<li><button data-team="${esc(t)}" title="Filtrar por ${esc(t)}">${esc(t)}</button><span class="bar" style="width:${Math.round(n/max*60)}px"></span><span class="cnt num">${n}</span></li>`).join(''):'<li style="color:var(--ink-3)">Sin datos</li>';
}
function renderDatalists(){
  const teams=new Set(TEAMS_SEED);matches.forEach(m=>{teams.add(m.local);if(m.visitante)teams.add(m.visitante);});
  $('#teamList').innerHTML=[...teams].sort().map(t=>`<option value="${esc(t)}">`).join('');
  const comps=new Set(COMP_KNOWN);matches.forEach(m=>comps.add(m.competicion));
  $('#compList').innerHTML=[...comps].map(t=>`<option value="${esc(t)}">`).join('');
  $('#sedeList').innerHTML=[...new Set(matches.map(m=>m.sede).filter(Boolean))].sort().map(t=>`<option value="${esc(t)}">`).join('');
  $('#puestoList').innerHTML=[...new Set(matches.map(m=>m.puesto).filter(Boolean))].sort().map(t=>`<option value="${esc(t)}">`).join('');
}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);

/* ---------- interacción ---------- */
$('#season').addEventListener('change',e=>{state.season=e.target.value;state.month='';render();});
$('#compChips').addEventListener('click',e=>{const b=e.target.closest('[data-comp]');if(!b)return;const c=b.dataset.comp;state.comps.has(c)?state.comps.delete(c):state.comps.add(c);render();});
$('#monthSel').addEventListener('change',e=>{state.month=e.target.value;render();});
$('#teamQ').addEventListener('input',e=>{state.team=e.target.value;render();});
$('#clearBtn').addEventListener('click',()=>{state.comps.clear();state.month='';state.team='';$('#teamQ').value='';render();});
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-team]');
  if(t){state.team=t.dataset.team;$('#teamQ').value=state.team;render();window.scrollTo({top:0,behavior:'smooth'});return;}
  const ed=e.target.closest('[data-edit]');
  if(ed)openForm(matches.find(m=>m.id===ed.dataset.edit));
});
$('#chart').addEventListener('mousemove',e=>{
  const hit=e.target.closest('.hit');const tip=$('#chart .tip');
  if(!hit){tip.style.display='none';return;}
  const r=$('#chart').getBoundingClientRect();
  tip.textContent=`${cap(MESES[+hit.dataset.m])}: ${hit.dataset.n} ${hit.dataset.n==='1'?'partido':'partidos'}`;
  tip.style.display='block';tip.style.left=(e.clientX-r.left)+'px';tip.style.top=(e.clientY-r.top-6)+'px';
});
$('#chart').addEventListener('mouseleave',()=>{$('#chart .tip').style.display='none';});
$('#chart').addEventListener('click',e=>{const hit=e.target.closest('.hit');if(!hit||hit.dataset.n==='0')return;state.month=state.month===hit.dataset.m?'':hit.dataset.m;render();});

/* ---------- formulario ---------- */
const dlg=$('#dlg');let editing=null;
function openForm(m){
  editing=m||null;
  $('#dlgTitle').textContent=m?'Editar partido':'Nuevo partido';
  $('#delBtn').hidden=!m;
  $('#err').classList.remove('show');
  $('#fFecha').value=m?.fecha||'';$('#fHora').value=m?.hora||'';$('#fComp').value=m?.competicion||'';$('#fJornada').value=m?.jornada||'';
  $('#fLocal').value=m?.local||'';$('#fVisit').value=m?.visitante||'';$('#fGL').value=m?.gl??'';$('#fGV').value=m?.gv??'';
  $('#fSede').value=m?.sede||'';$('#fPuesto').value=m?.puesto||'';$('#fNotas').value=m?.notas||'';
  dlg.showModal();$('#fFecha').focus();
}
$('#addBtn').addEventListener('click',()=>openForm());
$('#closeBtn').addEventListener('click',()=>dlg.close());
$('#form').addEventListener('submit',async e=>{
  e.preventDefault();
  const fecha=$('#fFecha').value,comp=$('#fComp').value.trim(),local=$('#fLocal').value.trim(),visit=$('#fVisit').value.trim();
  const err=$('#err');
  if(!fecha||!comp||!local){err.textContent='Faltan datos: fecha, competición y local son obligatorios.';err.classList.add('show');return;}
  const gl=$('#fGL').value,gv=$('#fGV').value;
  const m={id:editing?.id||uid(),fecha,hora:$('#fHora').value||'',competicion:comp,jornada:$('#fJornada').value.trim(),local,visitante:visit,
    gl:gl===''?null:+gl,gv:gv===''?null:+gv,sede:$('#fSede').value.trim(),puesto:$('#fPuesto').value.trim(),notas:$('#fNotas').value.trim(),temporada:seasonOf(fecha),
    creado:editing?.creado||new Date().toISOString()};
  $('#saveBtn').disabled=true;
  try{await store.put(m);dlg.close();toast(editing?'Partido actualizado':'Partido guardado');if(m.temporada!==state.season){state.season=m.temporada;render();}}
  catch(ex){err.textContent='No se pudo guardar ('+(ex.code||ex.message||'error')+'). Inténtalo de nuevo.';err.classList.add('show');}
  finally{$('#saveBtn').disabled=false;}
});
$('#delBtn').addEventListener('click',async()=>{
  if(!editing||!confirm(`¿Eliminar ${editing.local} – ${editing.visitante} del ${editing.fecha}?`))return;
  try{await store.del(editing.id);dlg.close();toast('Partido eliminado');}catch(ex){toast('No se pudo eliminar');}
});
$('#exportBtn').addEventListener('click',async()=>{
  if(!downloads)return;
  const rows=matches.filter(m=>m.temporada===state.season).sort((a,b)=>a.fecha.localeCompare(b.fecha));
  const csv=[['fecha','hora','competicion','jornada','local','goles_local','goles_visitante','visitante','sede','puesto','notas']]
    .concat(rows.map(m=>[m.fecha,m.hora,m.competicion,m.jornada,m.local,m.gl??'',m.gv??'',m.visitante,m.sede,m.puesto,m.notas]))
    .map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');
  try{await downloads.save({filename:`partidos-${state.season.replace('/','-')}.csv`,data:'﻿'+csv});}catch(ex){if(ex.code!=='declined')toast('No se pudo descargar');}
});
$('#refreshBtn').addEventListener('click',async()=>{
  const pend=pendingResults();if(!pend.length)return;
  const txt='Actualiza en el Cuaderno del Operador el resultado de estos partidos ya jugados (busca marcador, hora y estadio):\n'+pend.map(m=>`${m.fecha} ${m.competicion}: ${m.local} - ${m.visitante}`).join('\n');
  try{await navigator.clipboard.writeText(txt);toast(`Lista de ${pend.length} partido${pend.length===1?'':'s'} copiada. Pégala en el chat con Claude.`);}
  catch(e){prompt('Copia este texto y pégalo en el chat con Claude:',txt);}
});
let toastT;function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2200);}
/* ---------- arranque ---------- */
localStore.load();
(async()=>{
  const cap=await window.claude?.use?.('db');
  if(!cap){setStatus('Guardado solo en este navegador',false);return;}
  db=cap;
  const col=db.collection('partidos');
  store={
    async put(m){await col.doc(m.id).set(m);},
    async del(id){await col.doc(id).delete();}
  };
  col.onSnapshot(snap=>{
    matches=snap.docs.filter(d=>d.exists).map(d=>({id:d.id,...d.data()}));
    setStatus(snap.metadata.fromCache?'Sincronizando…':'Guardado en la nube',!snap.metadata.fromCache);
    render();
  },err=>{setStatus('Sin conexión con la base de datos',false);console.error(err);});
})();
(async()=>{
  downloads=await window.claude?.use?.('downloads');
  if(downloads)$('#exportBtn').hidden=false;
})();

document.addEventListener('keydown',e=>{if(e.key==='n'&&!dlg.open&&!/input|textarea|select/i.test(e.target.tagName))openForm();});
})();
</script>

</body></html>
